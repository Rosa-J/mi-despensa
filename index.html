<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Despensa</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f7d4f"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{--g:#1f6f43;--gl:#e3f1e8}*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,sans-serif;background:#f1f4f0;color:#1d2a22;padding-bottom:100px}header{background:var(--g);color:#fff;padding:14px 18px;font-size:1.3em;font-weight:700;position:sticky;top:0;z-index:5}main{padding:14px;max-width:640px;margin:auto}h2{font-size:1.55em;margin:.4em 0 .6em}h3{font-size:1.15em;color:var(--g);margin:.2em 0 .2em}.c{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0002}label{display:block;font-weight:600;margin:14px 0 4px}.h{font-weight:400;font-size:.8em;color:#5b695f}input,select{font:inherit;padding:12px;border:2px solid #c3cfc6;border-radius:14px;width:100%;min-height:54px;background:#fff}input:focus,select:focus{outline:0;border-color:var(--g)}button{font:inherit;font-weight:700;min-height:54px;padding:0 20px;border-radius:16px;border:0;background:var(--g);color:#fff;margin:8px 10px 8px 0}button.o{background:#fff;color:var(--g);border:2px solid var(--g)}button.d{background:#fff;color:#b3261e;border:2px solid #b3261e}.g{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}.s{font-size:.85em;color:#55635a;margin:4px 0}.big{font-size:1.25em;font-weight:700}.ok{background:var(--gl);color:var(--g);padding:12px;border-radius:12px;font-weight:700}.b{border-radius:12px;padding:2px 10px;font-size:.8em;color:#fff;white-space:nowrap}.b.r{background:#c62828}.b.y{background:#d99100}.b.o{background:#ef6c00}.b.g{background:#2f7d4f}.b.e{background:#fff!important;color:#222;border:2px dashed #666}.lt{border-top:1px dashed #b9c4bc;padding-top:8px;margin-top:8px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #cdd5cf;padding-bottom:env(safe-area-inset-bottom);z-index:6}nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:.68em;text-decoration:none;color:#55635a}nav a i{display:block;font-style:normal;font-size:1.9em;line-height:1.2}nav a.on{color:var(--g);font-weight:700;background:var(--gl)}.fab{position:fixed;right:14px;bottom:96px;z-index:7;box-shadow:0 4px 12px #0004;border-radius:30px;padding:0 24px}.w{background:#fff3cd;padding:12px;border-radius:12px}.bar{background:var(--g);height:10px;border-radius:5px}summary{font-weight:700;color:var(--g);min-height:44px;padding-top:10px}</style></head><body><header>🥫 Mi Despensa</header><main id="v"></main><button id="fab" class="fab" data-a="nc">＋ Compra rápida</button><nav id="nav"></nav><datalist id="pl"></datalist><datalist id="tl"></datalist>
<script>
const S=['productos','compras','lineas','lotes','movs','listas','items'];
let D={},db,V='inicio',F=null,P=null,L=null,CF=null,IF=null,MSG='';
//PURE
const U={g:['m',1],kg:['m',1000],mg:['m',.001],ml:['v',1],l:['v',1000],und:['c',1],docena:['c',12],paq:['p',1]};
const UL={m:'kg',v:'litro',c:'unidad',p:'paquete'};
const UA={l:'L',ml:'mL'},ua=u=>UA[u]||u;
const UN={g:'Gramos (g)',kg:'Kilogramos (kg)',mg:'Miligramos (mg)',ml:'Mililitros (mL)',l:'Litros (L)',und:'Unidades (und)',docena:'Docenas (doc)',paq:'Paquetes (paq)'};
const uopt=(sel,ks=Object.keys(U))=>ks.map(u=>`<option value="${u}" ${u==sel?'selected':''}>${UN[u]}</option>`).join('');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=s=>{const n=parseFloat(String(s).trim().replace(',','.'));return isFinite(n)?n:NaN};
const r3=x=>Math.round(x*1000)/1000;
const toBase=(q,u)=>r3(q*U[u][1]);
const cents=s=>Math.round(num(s)*100);
const unitP=(c,base,fam)=>c/(base/('mv'.includes(fam)?1000:1));
const fmt=c=>'S/ '+(c/100).toFixed(2).replace('.',',');
const fN=n=>String(r3(n)).replace('.',',');
const fQ=(b,f)=>f=='m'?(b>=1000?fN(b/1000)+' kg':fN(b)+' g'):f=='v'?(b>=1000?fN(b/1000)+' L':fN(b)+' mL'):fN(b)+(f=='c'?' und':' paq');
const fD=i=>i?i.split('-').reverse().join('/'):'';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addD=(i,n)=>{const d=new Date(i+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dd=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/864e5);
const wk=i=>addD(i,-((new Date(i+'T12:00:00Z').getUTCDay()+6)%7));
const disp=l=>r3(l.base-D.movs.filter(m=>m.loteId==l.id).reduce((s,m)=>s+m.base,0));
const eff=l=>l.vi||l.ve||null;
const lotesP=pid=>D.lotes.filter(l=>l.productoId==pid);
function alloc(pid,q,fam){const p=D.productos.find(x=>x.id==pid),cv=fam&&fam!=p.fam;let r=q,o=[];for(const l of lotesP(pid).filter(l=>disp(l)>0&&(!cv||l.eq>0)).sort((a,b)=>((eff(a)||'9999')+a.fecha).localeCompare((eff(b)||'9999')+b.fecha))){if(r<=0)break;const dl=disp(l),av=cv?r3(dl*l.eq/l.base):dl,t=Math.min(av,r),b=t==av?dl:cv?r3(t*l.base/l.eq):t;o.push({loteId:l.id,base:b});r=r3(r-t)}return r>0?null:o}
const LF=()=>{const cm=Object.fromEntries(D.compras.map(c=>[c.id,c]));return D.lineas.map(l=>({...l,fecha:cm[l.compraId].fecha,tienda:cm[l.compraId].tienda}))};
const last5=pid=>LF().filter(l=>l.productoId==pid).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.ts-a.ts).slice(0,5);
//ENDPURE
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getProd=n=>D.productos.find(p=>p.nombre.toLowerCase()==n.trim().toLowerCase());
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('despensa',1);r.onupgradeneeded=()=>S.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const loadAll=()=>Promise.all(S.map(s=>new Promise(ok=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>{D[s]=q.result;ok()}})));
const save=(s,o)=>{o.id=o.id||uid();const i=D[s].findIndex(x=>x.id==o.id);i<0?D[s].push(o):D[s][i]=o;return new Promise((ok,ko)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
const bad=l=>{const d=eff(l);if(!d)return'';const n=dd(d,today()),c=n<0?'r':n<=3?'y':n<=7?'o':'g';return `<span class="b ${c} ${l.vi?'':'e'}">${l.vi?'Vence':'Aprox.'} ${fD(d)}${n<0?' (vencido)':n==0?' (hoy)':''}</span>`};
const NOTA='<p class=s>“Vence” = fecha impresa en el envase. “Aprox.” (borde punteado) = estimación tuya: no garantiza que el alimento esté bien; revísalo antes de consumirlo.</p>';
function dl(name,text,type,force){const f=new File([text],name,{type});if(!force&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]}).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
const bk=force=>{dl('respaldo-despensa-'+today()+'.json',JSON.stringify({app:'mi-despensa',v:1,fecha:new Date().toISOString(),datos:D}),'application/json',force);localStorage.lb=today()};
const ch=a=>{if(a.length<2)return'<p class=s>Se necesitan 2 compras para el gráfico.</p>';const mx=Math.max(...a.map(x=>x.u)),mn=Math.min(...a.map(x=>x.u)),w=300,h=110,xs=i=>20+i*(w-40)/(a.length-1),ys=v=>mx==mn?h/2:15+(mx-v)/(mx-mn)*(h-35);return `<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="#2f7d4f" stroke-width="2" points="${a.map((x,i)=>xs(i)+','+ys(x.u)).join(' ')}"/>${a.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x.u)}" r="3" fill="#2f7d4f"/><text x="${xs(i)}" y="${ys(x.u)-6}" font-size="8" text-anchor="middle">${(x.u/100).toFixed(2).replace('.',',')}</text><text x="${xs(i)}" y="${h-3}" font-size="7" text-anchor="middle">${fD(x.fecha).slice(0,5)}</text>`).join('')}</svg>`};
const VW={
inicio(){const act=D.lotes.filter(l=>disp(l)>0),fr=act.filter(eff).sort((a,b)=>eff(a)<eff(b)?-1:1).slice(0,8),val=act.reduce((s,l)=>s+Math.round(l.precio*disp(l)/l.base),0),mes=today().slice(0,7),gm=LF().filter(l=>l.fecha.startsWith(mes)).reduce((s,l)=>s+l.precio,0),des=D.movs.filter(m=>m.tipo=='d').reduce((s,m)=>{const l=D.lotes.find(x=>x.id==m.loteId);return s+Math.round(l.precio*m.base/l.base)},0),n=localStorage.lb?dd(today(),localStorage.lb):null;
return `<h2>Mi Despensa</h2>`+(n===null||n>7?`<div class=w>⚠ ${n===null?'Aún no has hecho un respaldo.':'Hace '+n+' días que no haces un respaldo.'} <a href="#" data-a=tab data-id=ajustes>Hacer respaldo</a></div>`:'')+`<div class=c>Gasto del mes: <b>${fmt(gm)}</b><br>Valor estimado de la despensa: <b>${fmt(val)}</b><br>Desperdicio acumulado: <b>${fmt(des)}</b></div><h3>Consumir primero</h3>`+(fr.map(l=>`<div class=c>${esc(D.productos.find(p=>p.id==l.productoId).nombre)} · ${fQ(disp(l),D.productos.find(p=>p.id==l.productoId).fam)} ${bad(l)}</div>`).join('')||'<p class=s>Sin productos con fecha.</p>')+NOTA},
listas(){if(!L)return `<h2>Listas de compras</h2>`+D.listas.map(l=>`<div class=c data-a=ol data-id="${l.id}"><div class=big>${esc(l.nombre)}</div><div class=s>${D.items.filter(i=>i.listaId==l.id).length} productos · toca para abrir</div></div>`).join('')+`<button data-a=nl>＋ Nueva lista</button>`;
const l=D.listas.find(x=>x.id==L),it=D.items.filter(i=>i.listaId==L);return `<h2>${esc(l.nombre)}</h2><button class=o data-a=ol data-id="">← Todas las listas</button>`+it.map(i=>`<div class=c><label style="display:flex;gap:14px;align-items:center;margin:0"><input type=checkbox style="width:30px;min-height:30px" data-a=ck data-id="${i.id}" ${i.comprado?'checked':''} ${i.lineaId?'disabled':''}><span><b>${esc(i.n)}</b><br>${fN(i.q)} ${ua(i.u)} ${i.lineaId?'<span class="b g">Registrado</span>':i.comprado?'<span class="b y">Falta registrar</span>':''}</span></label>${i.lineaId?'':`<button class=o data-a=ei data-id="${i.id}">✏️ Editar</button>`}</div>`).join('')+`<button data-a=ni>＋ Agregar producto</button><button data-a=rc>🛒 Registrar compra de lo marcado</button>`},
despensa(){const ps=D.productos.filter(p=>lotesP(p.id).length).map(p=>({p,t:lotesP(p.id).reduce((s,l)=>s+disp(l),0)})).sort((a,b)=>(b.t>0)-(a.t>0)||a.p.nombre.localeCompare(b.p.nombre));
return `<h2>Despensa</h2>`+(ps.map(({p,t})=>`<div class=c><div class=big>${esc(p.nombre)}</div>${t>0?`<div>Disponible: <b>${fQ(t,p.fam)}</b></div>`:'<span class="b r">Agotado</span>'}`+lotesP(p.id).sort((a,b)=>a.fecha<b.fecha?1:-1).map(l=>{const d=disp(l),ln=D.lineas.find(x=>x.id==l.lineaId);return `<div class=lt><div class=s>Compra del ${fD(l.fecha)}: ${fQ(l.base,p.fam)} · consumido ${fQ(r3(l.base-d),p.fam)}</div><div><b>Disponible: ${fQ(d,p.fam)}</b>${l.eq>0?` (≈ ${fN(d*l.eq/l.base)} und)`:''} ${d>0?bad(l):''}</div>${ln?`<button class=o data-a=ec data-id="${ln.compraId}">✏️ Editar compra</button>`:''}</div>`}).join('')+(t>0?`<div class=lt><button data-a=mv data-id="${p.id}" data-t=c>Consumir</button><button class=o data-a=mv data-id="${p.id}" data-t=d>Desperdiciar</button></div>`:'')+`<button class=o data-a=rn data-id="${p.id}">✏️ Cambiar nombre</button></div>`).join('')||'<p class=s>Aún no hay productos. Usa “＋ Compra rápida”.</p>')+NOTA},
precios(){if(!P)return `<h2>Precios</h2>`+(D.productos.filter(p=>D.lineas.some(l=>l.productoId==p.id)).map(p=>{const x=last5(p.id)[0];return `<div class=c data-a=op data-id="${p.id}"><b>${esc(p.nombre)}</b><br><span class=s>Última: ${fmt(unitP(x.precio,x.base,x.fam))} por ${UL[x.fam]}</span></div>`}).join('')||'<p class=s>Aún no hay compras.</p>');
const p=D.productos.find(x=>x.id==P),t=last5(P).map(x=>({...x,u:unitP(x.precio,x.base,x.fam)}));
return `<h2>${esc(p.nombre)}</h2><button class=o data-a=op data-id="">← Precios</button><p class=s>Últimas 5 compras (precio por ${UL[p.fam]}). Las compras anteriores siguen en Gastos.</p>`+ch(t.slice().reverse())+t.map((x,i)=>{const n=t[i+1],pc=n?(x.u-n.u)/n.u*100:null;return `<div class=c><b>${fD(x.fecha)}</b> ${esc(x.tienda)} ${esc(x.marca)} ${esc(x.pres)}<br>${fN(x.q)} ${ua(x.unidad||'')} → ${fmt(x.precio)}<br><b>${fmt(x.u)}</b> por ${UL[x.fam]}`+(pc!==null?` · ${pc>0?'+':''}${pc.toFixed(2).replace('.',',')} % vs anterior${x.marca!=n.marca||x.pres!=n.pres?' ⚠ marca/presentación distinta: comparación no exacta':''}`:'')+`</div>`}).join('')},
gastos(){const a=LF(),gr=f=>{const m={};a.forEach(l=>{const k=f(l.fecha);m[k]=(m[k]||0)+l.precio});return Object.entries(m).sort((x,y)=>x[0]<y[0]?1:-1)},bars=(e,lab)=>{const mx=Math.max(1,...e.map(x=>x[1]));return e.slice(0,12).map(([k,v])=>`<div class=s>${lab(k)} <b>${fmt(v)}</b><div class=bar style="width:${v/mx*100}%"></div></div>`).join('')};
return `<h2>Gastos</h2><div class=c><b>Por semana</b> (lunes a domingo)${bars(gr(wk),k=>'Sem. del '+fD(k))}</div><div class=c><b>Por mes</b>${bars(gr(f=>f.slice(0,7)),k=>k.split('-').reverse().join('/'))}</div><button data-a=csv>Exportar CSV</button><h3>Historial completo de compras</h3>`+D.compras.slice().sort((x,y)=>x.fecha<y.fecha?1:-1).map(c=>{const ls=D.lineas.filter(l=>l.compraId==c.id);return `<div class=c><b>${fD(c.fecha)}</b> ${esc(c.tienda)} · <b>${fmt(ls.reduce((s,l)=>s+l.precio,0))}</b>`+ls.map(l=>`<div class=s>${esc(D.productos.find(p=>p.id==l.productoId).nombre)} · ${fN(l.q)} ${ua(l.u)} · ${fmt(l.precio)}</div>`).join('')+`<button class=o data-a=ec data-id="${c.id}">✏️ Editar compra</button></div>`}).join('')},
ajustes(){return `<h2>Ajustes y respaldo</h2><div class=c><p>Tus datos están solo en este celular. Haz respaldos seguido.</p><button data-a=bk>Exportar respaldo (JSON)</button><p><b>Restaurar</b> (reemplaza todo; antes se descarga una copia de lo actual)<input type=file accept=".json,application/json" id=rf></p><button class=o data-a=csv>Exportar compras a CSV (Excel)</button></div><div class=c class=s>Último respaldo: ${localStorage.lb?fD(localStorage.lb):'nunca'}<br>Almacenamiento persistente: ${navigator.storageIsPersistent==='sí'?'sí':esc(window.PERS||'?')}</div>`},
compra(){const fl=(t,h,x)=>`<label>${t}${h?` <span class=h>${h}</span>`:''}${x}</label>`,rw=(i,k,v,ph)=>`<input data-r=${i} data-k=${k} placeholder="${ph||''}" value="${esc(v)}">`;
return `<h2>${F.edit?'Editar compra':'Compra rápida'}</h2>`+(MSG?`<div class=ok>${MSG}</div>`:'')+`<p class=s>Solo son obligatorios: producto, cantidad, unidad y precio. Lo demás puedes completarlo después.</p><div class=c>`+fl('Fecha de compra','',`<input type=date data-k=fecha value="${F.fecha}">`)+fl('Lugar de compra','(opcional)',`<input data-k=tienda list=tl placeholder="Ej.: Mercado" value="${esc(F.tienda)}">`)+`</div>`+F.rows.map((r,i)=>`<div class=c><h3>Producto ${i+1}</h3>`+fl('Producto','',`<input list=pl data-r=${i} data-k=n placeholder="Ej.: Tomate" value="${esc(r.n)}">`)+`<div class=g><div>`+fl('Cantidad','',`<input inputmode=decimal data-r=${i} data-k=q placeholder="Ej.: 1" value="${esc(r.q)}">`)+`</div><div>`+fl('Unidad de medida','',`<select data-r=${i} data-k=u>${uopt(r.u)}</select>`)+`</div></div>`+fl('Precio total pagado (S/)','',`<input inputmode=decimal data-r=${i} data-k=p placeholder="Ej.: 4,00" value="${esc(r.p)}">`)+`<details${r.marca||r.pres||r.vi||r.dias||r.eq?' open':''}><summary>Más datos (opcional)</summary>`+fl('Marca','',rw(i,'marca',r.marca))+fl('Presentación','',rw(i,'pres',r.pres,'Ej.: bolsa de 500 g'))+fl('Vence (fecha impresa en el envase)','',`<input type=date data-r=${i} data-k=vi value="${r.vi}">`)+fl('Duración estimada en días','(aproximada, tuya)',`<input inputmode=numeric data-r=${i} data-k=dias placeholder="Ej.: 7" value="${esc(r.dias)}">`)+fl('Unidades que contiene esta compra','(solo si compras por peso o volumen pero consumes por unidad. Ej.: 1 kg de tomate = 7)',`<input inputmode=decimal data-r=${i} data-k=eq placeholder="Ej.: 7" value="${esc(r.eq)}">`)+`</details>`+(F.rows.length>1&&!r.lid?`<button class=d data-a=qr data-id=${i}>Quitar este producto</button>`:'')+`</div>`).join('')+`<button class=o data-a=ar>＋ Otro producto en esta compra</button><div><button data-a=sv>${F.edit?'Guardar cambios':'Guardar compra'}</button>`+(F.edit?`<button class=d data-a=dc>Eliminar compra</button>`:`<button class=o data-a=sv data-t=1>Guardar y agregar otra</button>`)+`<button class=o data-a=cc>Cancelar</button></div>`},
cons(){const p=D.productos.find(x=>x.id==CF.pid),t=lotesP(p.id).reduce((s,l)=>s+disp(l),0),ks=Object.keys(U).filter(u=>U[u][0]==p.fam).concat(p.fam=='m'||p.fam=='v'?(lotesP(p.id).some(l=>l.eq>0&&disp(l)>0)?['und']:[]):[]);
return `<h2>${CF.t=='c'?'Consumir':'Desperdiciar'}: ${esc(p.nombre)}</h2><div class=c>Disponible: <b>${fQ(t,p.fam)}</b>${lotesP(p.id).some(l=>l.eq>0&&disp(l)>0)?'<div class=s>Este producto tiene equivalencia en unidades.</div>':''}<div class=g><div><label>Cantidad<input inputmode=decimal data-c=q placeholder="Ej.: 100" value="${esc(CF.q)}"></label></div><div><label>Unidad de medida<select data-c=u>${uopt(CF.u,ks)}</select></label></div></div>`+(CF.t=='d'?`<label>Motivo <span class=h>(opcional)</span><input data-c=m placeholder="Ej.: se malogró" value="${esc(CF.m)}"></label>`:'')+`</div><button data-a=cs>Guardar</button><button class=o data-a=cx>Cancelar</button>`},
