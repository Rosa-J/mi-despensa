<script>
const S=['productos','compras','lineas','lotes','movs','listas','items'];

const U={g:['m',1],kg:['m',1000],mg:['m',.001],ml:['v',1],l:['v',1000],und:['c',1],docena:['c',12],paq:['p',1]};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=s=>{const n=parseFloat(String(s).trim().replace(',','.'));return isFinite(n)?n:NaN};
const r3=x=>Math.round(x*1000)/1000;
const toBase=(q,u)=>r3(q*U[u][1]);

const unitP=(c,base,fam)=>c/(base/('mv'.includes(fam)?1000:1));
const fmt=c=>'S/ '+(c/100).toFixed(2).replace('.',',');
const fN=n=>String(r3(n)).replace('.',',');
const fQ=(b,f)=>f=='m'?(b>=1000?fN(b/1000)+' kg':fN(b)+' g'):f=='v'?(b>=1000?fN(b/1000)+' l':fN(b)+' ml'):fN(b)+(f=='c'?' und':' paq');

const eff=l=>l.vi||l.ve||null;
const lotesP=pid=>D.lotes.filter(l=>l.productoId==pid);
function alloc(pid,q){let r=q,o=[];for(const l of lotesP(pid).filter(l=>disp(l)>0).sort((a,b)=>((eff(a)||'9999')+a.fecha).localeCompare((eff(b)||'9999')+b.fecha))){if(r<=0)break;const t=Math.min(disp(l),r);o.push({loteId:l.id,base:t});r=r3(r-t)}return r>0?null:o}
const LF=()=>{const cm=Object.fromEntries(D.compras.map(c=>[c.id,c]));return D.lineas.map(l=>({...l,fecha:cm[l.compraId].fecha,tienda:cm[l.compraId].tienda}))};
const last5=pid=>LF().filter(l=>l.productoId==pid).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.ts-a.ts).slice(0,5);
//ENDPURE
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getProd=n=>D.productos.find(p=>p.nombre.toLowerCase()==n.trim().toLowerCase());
const open=()=>new Promise((ok,ko)=>{const r=indexedDB.open('despensa',1);r.onupgradeneeded=()=>S.forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const loadAll=()=>Promise.all(S.map(s=>new Promise(ok=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>{D[s]=q.result;ok()}})));
const save=(s,o)=>{o.id=o.id||uid();const i=D[s].findIndex(x=>x.id==o.id);i<0?D[s].push(o):D[s][i]=o;return new Promise((ok,ko)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=ok;t.onerror=()=>ko(t.error)})};
const bad=l=>{const d=eff(l);if(!d)return'';const n=dd(d,today()),c=n<0?'r':n<=3?'y':n<=7?'o':'g';return `<span class="b ${c} ${l.vi?'':'e'}">${l.vi?'Vence':'Aprox.'} ${fD(d)}${n<0?' (vencido)':n==0?' (hoy)':''}</span>`};
const NOTA='<p class=s>“Vence” = fecha impresa en el envase. “Aprox.” (borde punteado) = estimación tuya: no garantiza que el alimento esté bien; revísalo antes de consumirlo.</p>';
function dl(name,text,type,force){const f=new File([text],name,{type});if(!force&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]}).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
const bk=force=>{dl('respaldo-despensa-'+today()+'.json',JSON.stringify({app:'mi-despensa',v:1,fecha:new Date().toISOString(),datos:D}),'application/json',force);localStorage.lb=today()};
const ch=a=>{if(a.length<2)return'<p class=s>Se necesitan 2 compras para el gráfico.</p>';const mx=Math.max(...a.map(x=>x.u)),mn=Math.min(...a.map(x=>x.u)),w=300,h=110,xs=i=>20+i*(w-40)/(a.length-1),ys=v=>mx==mn?h/2:15+(mx-v)/(mx-mn)*(h-35);return `<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="#2f7d4f" stroke-width="2" points="${a.map((x,i)=>xs(i)+','+ys(x.u)).join(' ')}"/>${a.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x.u)}" r="3" fill="#2f7d4f"/><text x="${xs(i)}" y="${ys(x.u)-6}" font-size="8" text-anchor="middle">${(x.u/100).toFixed(2).replace('.',',')}</text><text x="${xs(i)}" y="${h-3}" font-size="7" text-anchor="middle">${fD(x.fecha).slice(0,5)}</text>`).join('')}</svg>`};
const VW={
inicio(){const act=D.lotes.filter(l=>disp(l)>0),fr=act.filter(eff).sort((a,b)=>eff(a)<eff(b)?-1:1).slice(0,8),val=act.reduce((s,l)=>s+Math.round(l.precio*disp(l)/l.base),0),mes=today().slice(0,7),gm=LF().filter(l=>l.fecha.startsWith(mes)).reduce((s,l)=>s+l.precio,0),des=D.movs.filter(m=>m.tipo=='d').reduce((s,m)=>{const l=D.lotes.find(x=>x.id==m.loteId);return s+Math.round(l.precio*m.base/l.base)},0),n=localStorage.lb?dd(today(),localStorage.lb):null;
return `<h2>Mi Despensa</h2>`+(n===null||n>7?`<div class=w>⚠ ${n===null?'Aún no has hecho un respaldo.':'Hace '+n+' días que no haces un respaldo.'} <a href="#" data-a=tab data-id=ajustes>Hacer respaldo</a></div>`:'')+`<div class=c>Gasto del mes: <b>${fmt(gm)}</b><br>Valor estimado de la despensa: <b>${fmt(val)}</b><br>Desperdicio acumulado: <b>${fmt(des)}</b></div><h3>Consumir primero</h3>`+(fr.map(l=>`<div class=c>${esc(D.productos.find(p=>p.id==l.productoId).nombre)} · ${fQ(disp(l),D.productos.find(p=>p.id==l.productoId).fam)} ${bad(l)}</div>`).join('')||'<p class=s>Sin productos con fecha.</p>')+NOTA},
listas(){if(!L)return `<h2>Listas</h2>`+D.listas.map(l=>`<div class=c data-a=ol data-id="${l.id}"><b>${esc(l.nombre)}</b> <span class=s>${D.items.filter(i=>i.listaId==l.id).length} productos</span></div>`).join('')+`<button data-a=nl>+ Nueva lista</button>`;
const l=D.listas.find(x=>x.id==L),it=D.items.filter(i=>i.listaId==L);return `<h2>${esc(l.nombre)}</h2><button class=o data-a=ol data-id="">← Listas</button>`+it.map(i=>`<div class=c><label><input type=checkbox style="width:auto" data-a=ck data-id="${i.id}" ${i.comprado?'checked':''} ${i.lineaId?'disabled':''}> ${esc(i.n)} · ${fN(i.q)} ${i.u} ${i.lineaId?'<span class="b g">Registrado</span>':i.comprado?'<span class="b y">Falta registrar</span>':''}</label></div>`).join('')+`<button data-a=ni>+ Producto</button><button data-a=rc>Registrar compra de los marcados</button>`},
despensa(){const ps=D.productos.filter(p=>lotesP(p.id).length).map(p=>({p,t:lotesP(p.id).reduce((s,l)=>s+disp(l),0)})).sort((a,b)=>(b.t>0)-(a.t>0)||a.p.nombre.localeCompare(b.p.nombre));

precios(){if(!P)return `<h2>Precios</h2>`+(D.productos.filter(p=>D.lineas.some(l=>l.productoId==p.id)).map(p=>{const x=last5(p.id)[0];return `<div class=c data-a=op data-id="${p.id}"><b>${esc(p.nombre)}</b><br><span class=s>Última: ${fmt(unitP(x.precio,x.base,x.fam))} por ${UL[x.fam]}</span></div>`}).join('')||'<p class=s>Aún no hay compras.</p>');
const p=D.productos.find(x=>x.id==P),t=last5(P).map(x=>({...x,u:unitP(x.precio,x.base,x.fam)}));
return `<h2>${esc(p.nombre)}</h2><button class=o data-a=op data-id="">← Precios</button><p class=s>Últimas 5 compras (precio por ${UL[p.fam]}). Las compras anteriores siguen en Gastos.</p>`+ch(t.slice().reverse())+t.map((x,i)=>{const n=t[i+1],pc=n?(x.u-n.u)/n.u*100:null;return `<div class=c><b>${fD(x.fecha)}</b> ${esc(x.tienda)} ${esc(x.marca)} ${esc(x.pres)}<br>${fN(x.q)} ${x.u?'':''}${x.u!==undefined?'':''}${esc(x.unidad||'')} → ${fmt(x.precio)}<br><b>${fmt(x.u)}</b> por ${UL[x.fam]}`+(pc!==null?` · ${pc>0?'+':''}${pc.toFixed(2).replace('.',',')} % vs anterior${x.marca!=n.marca||x.pres!=n.pres?' ⚠ marca/presentación distinta: comparación no exacta':''}`:'')+`</div>`}).join('')},
gastos(){const a=LF(),gr=f=>{const m={};a.forEach(l=>{const k=f(l.fecha);m[k]=(m[k]||0)+l.precio});return Object.entries(m).sort((x,y)=>x[0]<y[0]?1:-1)},bars=(e,lab)=>{const mx=Math.max(1,...e.map(x=>x[1]));return e.slice(0,12).map(([k,v])=>`<div class=s>${lab(k)} <b>${fmt(v)}</b><div class=bar style="width:${v/mx*100}%"></div></div>`).join('')};
return `<h2>Gastos</h2><div class=c><b>Por semana</b> (lunes a domingo)${bars(gr(wk),k=>'Sem. del '+fD(k))}</div><div class=c><b>Por mes</b>${bars(gr(f=>f.slice(0,7)),k=>k.split('-').reverse().join('/'))}</div><button data-a=csv>Exportar CSV</button><h3>Historial completo de compras</h3>`+D.compras.slice().sort((x,y)=>x.fecha<y.fecha?1:-1).map(c=>{const ls=D.lineas.filter(l=>l.compraId==c.id);return `<div class=c><b>${fD(c.fecha)}</b> ${esc(c.tienda)} · <b>${fmt(ls.reduce((s,l)=>s+l.precio,0))}</b>`+ls.map(l=>`<div class=s>${esc(D.productos.find(p=>p.id==l.productoId).nombre)} · ${fN(l.q)} ${l.u} · ${fmt(l.precio)}</div>`).join('')+`</div>`}).join('')},
ajustes(){return `<h2>Ajustes y respaldo</h2><div class=c><p>Tus datos están solo en este celular. Haz respaldos seguido.</p><button data-a=bk>Exportar respaldo (JSON)</button><p><b>Restaurar</b> (reemplaza todo; antes se descarga una copia de lo actual)<input type=file accept=".json,application/json" id=rf></p><button class=o data-a=csv>Exportar compras a CSV (Excel)</button></div><div class=c class=s>Último respaldo: ${localStorage.lb?fD(localStorage.lb):'nunca'}<br>Almacenamiento persistente: ${navigator.storageIsPersistent==='sí'?'sí':esc(window.PERS||'?')}</div>`},
compra(){return `<h2>Registrar compra</h2><label>Fecha<input type=date data-k=fecha value="${F.fecha}"></label><label>Tienda (opcional)<input data-k=tienda list=tl value="${esc(F.tienda)}"></label>`+F.rows.map((r,i)=>`<div class=c><b>Producto ${i+1}</b><input placeholder="Producto" list=pl data-r=${i} data-k=n value="${esc(r.n)}"><div class=g><input inputmode=decimal placeholder="Cantidad" data-r=${i} data-k=q value="${esc(r.q)}"><select data-r=${i} data-k=u>${Object.keys(U).map(u=>`<option ${u==r.u?'selected':''}>${u}</option>`).join('')}</select></div><input inputmode=decimal placeholder="Precio pagado por esta cantidad (S/)" data-r=${i} data-k=p value="${esc(r.p)}"><details><summary>Más datos</summary><input placeholder="Marca" data-r=${i} data-k=marca value="${esc(r.marca)}"><input placeholder="Presentación (ej. bolsa 500 g)" data-r=${i} data-k=pres value="${esc(r.pres)}"><label>Vence (fecha impresa)<input type=date data-r=${i} data-k=vi value="${r.vi}"></label><input inputmode=numeric placeholder="O duración estimada en días" data-r=${i} data-k=dias value="${esc(r.dias)}"></details></div>`).join('')+`<button class=o data-a=ar>+ Otro producto</button><br><button data-a=sv>Guardar compra</button><button class=o data-a=cc>Cancelar</button>`}};
const R=()=>{$('#pl').innerHTML=D.productos.map(p=>`<option value="${esc(p.nombre)}">`).join('');$('#tl').innerHTML=[...new Set(D.compras.map(c=>c.tienda).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('');$('#v').innerHTML=F?VW.compra():VW[V]();$('#nav').innerHTML=[['inicio','Inicio'],['listas','Listas'],['despensa','Despensa'],['precios','Precios'],['gastos','Gastos'],['ajustes','Ajustes']].map(([k,t])=>`<a href="#" data-a=tab data-id=${k} class="${V==k?'on':''}">${t}</a>`).join('')};
const newRow=(o={})=>({n:'',q:'',u:'g',p:'',marca:'',pres:'',vi:'',dias:'',...o});
async function mv(pid,tipo){const p=D.productos.find(x=>x.id==pid),q=prompt((tipo=='c'?'¿Cuánto consumiste?':'¿Cuánto se desperdició?')+' Ej.: 250 g, 1,5 kg, 2 und');if(!q)return;const m=q.trim().match(/^([\d.,]+)\s*([a-z]*)$/i),u=m?(m[2]||{m:'g',v:'ml',c:'und',p:'paq'}[p.fam]).toLowerCase():'';if(!m||!U[u]||U[u][0]!=p.fam||!(num(m[1])>0))return alert('No entendí la cantidad o la unidad no corresponde a este producto.');const a=alloc(pid,toBase(num(m[1]),u));if(!a)return alert('No hay suficiente existencia.');const mo=tipo=='d'?prompt('Motivo (venció, se malogró, sobró…)')||'':'';for(const x of a)await save('movs',{...x,tipo,motivo:mo,fecha:today()});R()}
async function sv(){const rows=F.rows.filter(r=>r.n.trim());if(!rows.length||!F.fecha)return alert('Falta la fecha o al menos un producto.');for(const r of rows){if(!(num(r.q)>0)||!(num(r.p)>=0))return alert('Revisa cantidad y precio de '+r.n);const p=getProd(r.n);if(p&&p.fam!=U[r.u][0])return alert(r.n+' ya se registró en otra familia de unidades ('+UL[p.fam]+'); no se pueden mezclar.')}
const c={fecha:F.fecha,tienda:F.tienda.trim(),ts:Date.now()};await save('compras',c);for(const r of rows){let p=getProd(r.n);if(!p){p={nombre:r.n.trim(),fam:U[r.u][0]};await save('productos',p)}const base=toBase(num(r.q),r.u),precio=cents(r.p),ln={compraId:c.id,productoId:p.id,q:num(r.q),u:r.u,unidad:r.u,base,fam:p.fam,precio,marca:r.marca.trim(),pres:r.pres.trim(),ts:Date.now()};await save('lineas',ln);await save('lotes',{lineaId:ln.id,productoId:p.id,fecha:F.fecha,base,precio,vi:r.vi||null,ve:num(r.dias)>0?addD(F.fecha,num(r.dias)):null});if(r.item){const it=D.items.find(i=>i.id==r.item);it.lineaId=ln.id;await save('items',it)}}F=null;V='gastos';R()}
const csv=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"',n=x=>String(x).replace('.',',');dl('compras-despensa-'+today()+'.csv','\ufeff'+['Fecha;Tienda;Producto;Marca;Presentación;Cantidad;Unidad;Total S/;Precio por kg/litro/unidad S/'].concat(LF().sort((a,b)=>a.fecha<b.fecha?-1:1).map(l=>[fD(l.fecha),q(l.tienda),q(D.productos.find(p=>p.id==l.productoId).nombre),q(l.marca),q(l.pres),n(l.q),l.u,n((l.precio/100).toFixed(2)),n((unitP(l.precio,l.base,l.fam)/100).toFixed(2))].join(';'))).join('\r\n'),'text/csv',true)};
const H={tab:id=>{V=id;L=null;P=null;R()},ol:id=>{L=id||null;R()},op:id=>{P=id||null;R()},cc:()=>{F=null;R()},ar:()=>{F.rows.push(newRow());R()},nc:()=>{F={fecha:today(),tienda:'',rows:[newRow()]};R()},bk:()=>bk(),csv,
nl:async()=>{const n=prompt('Nombre de la lista');if(n){const l={nombre:n};await save('listas',l);L=l.id;R()}},
ni:async()=>{const t=prompt('Producto y cantidad. Ej.: Lentejas 250 g'),m=t&&t.trim().match(/^(.+?)\s+([\d.,]+)\s*([a-z]*)$/i),u=m?(m[3]||'und').toLowerCase():'';if(!m||!U[u]||!(num(m[2])>0))return t&&alert('Escribe: producto, cantidad y unidad (g, kg, ml, l, und, docena, paq).');await save('items',{listaId:L,n:m[1],q:num(m[2]),u,comprado:false});R()},

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.dataset.a=='ck'&&e.target!=a&&e.target.tagName!='INPUT')return;if(a.tagName=='A')e.preventDefault();const f=H[a.dataset.a];if(f)a.dataset.a=='mv'?f(a.dataset.id,a.dataset.t):f(a.dataset.id)});
